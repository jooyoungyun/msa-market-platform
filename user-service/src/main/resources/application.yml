server:
  port: 9001
spring:
  application:
    name: user-service
  cloud:
    bus:
      enabled: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://localhost:3306/msa_ecommerce}
    username: ${DB_USERNAME:msa}
    password: ${DB_PASSWORD:msa1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDB103Dialect
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}
    fetch-registry: true
    register-with-eureka: true

gateway:
  ip: 127.0.0.1

token:
  expiration_time: ${JWT_EXPIRATION_TIME:86400000}
  # apigateway-service와 반드시 같은 값을 사용한다.
  secret: ${JWT_SECRET:bXNhLW1hcmtldC1sb2NhbC1kZXYtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}

greeting:
  message: Welcome to the Simple E-commerce.

app:
  init-data:
    enabled: true

logging:
  level:
    com.example.userservice.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, info, metrics, prometheus
  health:
    rabbit:
      enabled: false
