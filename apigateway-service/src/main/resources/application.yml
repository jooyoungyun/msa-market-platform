server:
  port: 8000

spring:
  application:
    name: apigateway-service
  cloud:
    bus:
      enabled: false
    gateway:
      default-filters:
        - name: GlobalFilter
          args:
            baseMessage: MSA Market Gateway
            preLogger: true
            postLogger: true
      routes:
        # ─────────────────────────────────────────────
        # User Service
        # ─────────────────────────────────────────────

        # 로그인: 공개
        - id: user-login
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/login
            - Method=POST
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        # 회원가입: 공개
        - id: user-create
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users
            - Method=POST
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        # Health check: 공개
        - id: user-health
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/health_check
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        # 회원 목록 조회: ROLE_ADMIN
        - id: user-list-get
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter=ADMIN

        # 회원 수정: ROLE_ADMIN
        - id: user-update
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users/**
            - Method=PUT
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter=ADMIN

        # 회원 삭제: ROLE_ADMIN
        - id: user-delete
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users/**
            - Method=DELETE
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter=ADMIN

        # 회원 상세 조회: 로그인 필요 + user-service 에서 본인/관리자 ownership 검증
        - id: user-detail-get
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users/**
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter

        # ─────────────────────────────────────────────
        # Catalog Service
        # ─────────────────────────────────────────────

        # 상품 등록/수정/삭제: ROLE_ADMIN
        - id: catalog-admin-write
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/catalog-service/catalogs,/catalog-service/catalogs/**
            - Method=POST,PUT,DELETE
          filters:
            - AuthorizationHeaderFilter=ADMIN

        # Kafka 이벤트 로그 삭제: ROLE_ADMIN
        - id: catalog-kafka-clear
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/catalog-service/kafka/events
            - Method=DELETE
          filters:
            - AuthorizationHeaderFilter=ADMIN

        # 상품 조회 · Kafka 이벤트 조회 · Health: 공개 (데모용)
        - id: catalog-public-read
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/catalog-service/**
            - Method=GET

        # ─────────────────────────────────────────────
        # Order Service
        # ─────────────────────────────────────────────

        # Health check: 공개
        - id: order-health
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/health_check
            - Method=GET

        # 전체 주문 조회: ROLE_ADMIN
        - id: order-admin-list
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/orders
            - Method=GET
          filters:
            - AuthorizationHeaderFilter=ADMIN

        # 주문 취소: ROLE_ADMIN
        - id: order-admin-delete
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/orders/**
            - Method=DELETE
          filters:
            - AuthorizationHeaderFilter=ADMIN

        # 주문 생성 · 사용자별 주문 조회: 로그인 필요
        # order-service 에서 JWT 사용자와 path userId를 다시 대조한다.
        # 내부 Feign 경로 /order-service/internal/** 는 Gateway에 노출하지 않는다.
        - id: order-user
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/{userId}/orders
            - Method=GET,POST
          filters:
            - AuthorizationHeaderFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}

token:
  # jjwt 0.9.1 은 이 문자열을 Base64 로 해석한다.
  # 운영에서는 반드시 주입할 것: export JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
  secret: ${JWT_SECRET:bXNhLW1hcmtldC1sb2NhbC1kZXYtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
