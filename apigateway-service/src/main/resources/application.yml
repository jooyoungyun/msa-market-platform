server:
  port: 8000

spring:
  application:
    name: apigateway-service
  cloud:
    bus:
      enabled: false
    gateway:
      default-filters:
        - name: GlobalFilter
          args:
            baseMessage: MSA Market Gateway
            preLogger: true
            postLogger: true
      routes:
        # 로그인: 공개
        - id: user-login
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/login
            - Method=POST
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        # 회원가입: 공개
        - id: user-create
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users
            - Method=POST
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        # User Health: 로그인 전에도 공개
        - id: user-health
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/health_check
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        # User 관리자 수정: JWT 필요
        - id: user-update
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users/**
            - Method=PUT
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter

        # User 관리자 삭제: JWT 필요
        - id: user-delete
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users/**
            - Method=DELETE
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter

        # User 목록 조회: JWT 필요
        - id: user-list-get
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter

        # User 상세 조회: JWT 필요
        - id: user-detail-get
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/users/**
            - Method=GET
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            - AuthorizationHeaderFilter

        # Catalog 관리자 쓰기: JWT 필요
        - id: catalog-admin-write
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/catalog-service/catalogs,/catalog-service/catalogs/**
            - Method=POST,PUT,DELETE
          filters:
            - AuthorizationHeaderFilter

        # Catalog 조회/Kafka Monitor: 공개 Demo API
        - id: catalog-service
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/catalog-service/**

        # Order 관리자 전체 조회: JWT 필요
        - id: order-admin-list
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/orders
            - Method=GET
          filters:
            - AuthorizationHeaderFilter

        # Order 관리자 취소/삭제: JWT 필요
        - id: order-admin-delete
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/orders/**
            - Method=DELETE
          filters:
            - AuthorizationHeaderFilter

        # 일반 주문 생성/사용자별 조회
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}

token:
  secret: msa_test_token_secret_2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
