server:
  port: 9003

spring:
  application:
    name: order-service
  zipkin:
    enabled: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/msa_ecommerce
    username: msa
    password: msa1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDB103Dialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3

app:
  init-data:
    enabled: true
  kafka:
    catalog-topic: example-catalog-topic

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka

logging:
  level:
    com.example.orderservice: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
